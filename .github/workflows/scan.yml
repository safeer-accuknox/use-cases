name: AccuKnox Container Scan

on:
  push:
    branches:
      - all

jobs:
  scan-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: "Run Accuknox SAST"
      #   uses: accuknox/sast-scan-opengrep-action@1.0.0
      #   with:
      #     accuknox_endpoint: "cspm.demo.accuknox.com"
      #     accuknox_tenant: 3730
      #     accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
      #     accuknox_label: "SPOC"
      #     input_soft_fail: "true"
      #     upload_artifact: false

      #   - name: AccuKnox Secret Scan
      #     uses: accuknox/secret-scan-action@v1.0.1
      #     with:
      #       token: ${{ secrets.ACCUKNOX_TOKEN }}
      #       tenant_id: 3730
      #       label: "SPOC"
      #       endpoint:  "cspm.demo.accuknox.com"
      #       fail: false
            use_extended_ruleset: true

        - name: "Run Accuknox SAST"
          uses:  r3d-shadow/sast-scan-action@main
          with:
            sonar_token: ${{ secrets.SONAR_CLOUD_TOKEN_TEST }}
            sonar_host_url: "https://sonarcloud.io"
            sonar_project_key: "r3d-shadow_azure-plugin-test"
            sonar_organization_id: "r3d-shadow"
            accuknox_endpoint: "cspm.demo.accuknox.com"
            accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
            tenant_id: 3730
            label: "SPOC"
            input_soft_fail: false
            skip_sonar_scan: false