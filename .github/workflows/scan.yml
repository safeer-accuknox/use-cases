      #     input_soft_fail: true
      #     skip_sonar_scan: true

      # - name: Run IaC scan
      #   uses: Vickydew1/iac-scan-action@main
      #   with:
      #     directory: "."
      #     compact: true
      #     quiet: true 
      #     output_format: json
      #     output_file_path: "./results.json"
      #     token: ${{ secrets.ACCUKNOX_TOKEN }}
      #     tenant_id: 3730
