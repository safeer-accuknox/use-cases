name: AccuKnox Container Scan

on:
  push:
    branches:
      - lonaci-test

jobs:
  scan-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up AccuKnox ASPM Scanner
        run: |
          sudo curl -L https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.10.1/accuknox-aspm-scanner_linux_x86_64 \
            -o /tmp/accuknox-aspm-scanner
          chmod +x /tmp/accuknox-aspm-scanner

      - name: Run DAST Scan
        env:
          ACCUKNOX_TOKEN: ${{ secrets.ACCUKNOX_TOKEN }}
          ACCUKNOX_TENANT: 3730
          ACCUKNOX_ENDPOINT:  "cspm.demo.accuknox.com"
          ACCUKNOX_LABEL: "SPOC"
        run: |
          accuknox-aspm-scanner scan dast \
            --command "zap.sh -loglevel debug -cmd -autorun /zap/wrk/lonaci.yaml" \
            --container-mode