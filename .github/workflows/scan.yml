name: AccuKnox Scan Workflow

on:
  push:
    branches:
      - all

jobs:
  accuknox-cicd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main

      # - name: AccuKnox Secret Scan
      #   uses: accuknox/secret-scan-action@v1.0.1
      #   with:
      #     token: ${{ secrets.ACCUKNOX_TOKEN }}
      #     tenant_id: 3730
      #     label: "SPOC"
      #     endpoint:  "cspm.demo.accuknox.com"
      #     fail: false
      #     use_extended_ruleset: true

      # - name: "Run Accuknox SAST: Opengrep"
      #   uses: accuknox/sast-scan-opengrep-action@1.0.0
      #   with:
      #     accuknox_endpoint: "cspm.demo.accuknox.com"
      #     accuknox_tenant: 3730
      #     accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
      #     accuknox_label: "SPOC"
      #     input_soft_fail: "true"
      #     upload_artifact: false

      # ------------------------------------------ Checkmarx: START ------------------------------------------ 
      - name: Run cxjob Docker container
        run: |
          docker run --rm -e API_KEY=${{ secrets.IAM_API_KEY }} \
            -e PROJECT_NAME=udit-uniyal/Damn-vulnerable-sca \
            -e REPORT_PATH=/app/data/ \
            -v ${{ github.workspace }}:/app/data \
            cxjob

      - name: Upload Report to AccuKnox
        run: |
          FILE=$(ls CHECKMARX-CX-*.json | head -n 1)
          curl --fail --location \
            --request POST "https://cspm.demo.accuknox.com/api/v1/artifact/?tenant_id=3730&data_type=IAC&label_id=SPOC&save_to_s3=true" \
            --header "Tenant-Id: 3730" \
            --header "Authorization: Bearer ${{ secrets.CSPM_API_TOKEN }}" \
            --form "file=@${FILE}"
      # ------------------------------------------ Checkmarx: END ------------------------------------------ 