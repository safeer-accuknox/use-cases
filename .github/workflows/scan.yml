name: AccuKnox Container Scan

on:
  push:
    branches:
      - all

jobs:
  ak-scans:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: "Run Accuknox SAST"
