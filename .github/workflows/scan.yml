name: AccuKnox DAST Scan

on:
  push:
    branches:
      - lonaci-test

jobs:
  scan-dast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up AccuKnox ASPM Scanner
        run: |
          curl -L https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.10.1/accuknox-aspm-scanner_linux_x86_64 \
            -o /tmp/accuknox-aspm-scanner
          chmod +x /tmp/accuknox-aspm-scanner

      - name: Run DAST Scan
        env:
          ACCUKNOX_TOKEN: ${{ secrets.ACCUKNOX_TOKEN }}
          ACCUKNOX_TENANT: 3730
          ACCUKNOX_ENDPOINT:  "cspm.demo.accuknox.com"
          ACCUKNOX_LABEL: "SPOC"
          DEBUG: "TRUE"
        run: |
          mkdir /tmp/scan-dir
          cp dast-config.yaml /tmp/scan-dir
          cd /tmp/scan-dir
          chmod -R 777 .
          /tmp/accuknox-aspm-scanner scan dast \
            --command "zap.sh -loglevel debug -cmd -autorun /zap/wrk/dast-config.yaml" \
            --container-mode
