      #     endpoint: "cspm.demo.accuknox.com"

      - name: AccuKnox Secret Scan
        uses: accuknox/secret-scan-action@v1.0.1
        with:
          token: ${{ secrets.ACCUKNOX_TOKEN }}
          tenant_id: 3730
          label: "SPOC"
          endpoint:  "cspm.demo.accuknox.com"
          fail: false
          use_extended_ruleset: true


      - name: "Accuknox SAST"
        uses: accuknox/sast-scan-opengrep-action@1.0.0
        with:
          accuknox_endpoint: "cspm.demo.accuknox.com"
          accuknox_tenant: 3730
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_label: "SPOC"
          input_soft_fail: "true"
          upload_artifact: false

      - name: Build Docker image
        run: |
          docker build -t my-app:latest .
          sudo rm -rf results.json
          
      - name: AccuKnox Container Scan
        uses: accuknox/container-scan-action@1.0.0
        with:
          endpoint: "cspm.demo.accuknox.com"
          tenant_id: 3730
          token: ${{ secrets.ACCUKNOX_TOKEN }}
          label: "SPOC"
          image: "my-app"
          tag: "latest"
          severity: "CRITICAL"

      - name: AccuKnox DAST
        uses: accuknox/dast-scan-action@v1.0.0
        with:
          target_url: "http://testphp.vulnweb.com"
          accuknox_endpoint: "cspm.demo.accuknox.com"
          tenant_id: 3730
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          label: "SPOC"
          severity_threshold: "Critical"
          scan_type: "baseline"



