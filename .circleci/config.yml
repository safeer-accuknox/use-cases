version: 2.1

orbs:
  accuknox-scan: accuknox-scan/accuknox-test-scan@dev:1.118

jobs:
  build-docker-image:
    docker:
      - image: cimg/base:stable
    environment:
      IMAGE_NAME: circleci
      TAG: test
      DOCKERFILE: Dockerfile
      BUILD_CONTEXT: .
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker Image
          command: |
            TAG=${TAG:-$CIRCLE_SHA1}
            docker build -t $IMAGE_NAME:$TAG -f $DOCKERFILE $BUILD_CONTEXT
            echo "export DOCKER_IMAGE=$IMAGE_NAME:$TAG" >> $BASH_ENV
      - run:
          name: Save Docker Image as tarball
          command: docker save $IMAGE_NAME:$TAG -o image.tar
      - persist_to_workspace:
          root: .
          paths:
            - image.tar

  container-scan:
    docker:
      - image: cimg/base:stable
    environment:
      IMAGE_NAME: circleci
      TAG: test
      SOFT_FAIL: true
    steps:
      - attach_workspace:
          at: .
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Load Docker Image from tarball
          command: docker load -i image.tar
      - accuknox-scan/container:
          IMAGE_NAME: circleci
          TAG: test
          SOFT_FAIL: true

workflows:
  accuknox:
    jobs:
      - build-docker-image
      - container-scan:
          requires:
            - build-docker-image