version: 2.1

orbs:
  accuknox-scan: accuknox-scan/accuknox-test-scan@dev:1.118

jobs:
  build-docker-image:
    docker:
      - image: cimg/base:stable
    environment:
      IMAGE_NAME: circleci
      TAG: test
      DOCKERFILE: Dockerfile
      BUILD_CONTEXT: .
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker Image
          command: |
            TAG=${TAG:-$CIRCLE_SHA1}
            docker build -t $IMAGE_NAME:$TAG -f $DOCKERFILE $BUILD_CONTEXT
            echo "export DOCKER_IMAGE=$IMAGE_NAME:$TAG" >> $BASH_ENV

workflows:
  accuknox:
    jobs:
      # - accuknox-scan/sast:
          # SOFT_FAIL: true
      # - accuknox-scan/iac:
      #     SOFT_FAIL: true
      #     FRAMEWORK: "terraform"
      # - accuknox-scan/secret:
      #     SOFT_FAIL: true
      - build-docker-image
      - accuknox-scan/container:
          requires:
            - build-docker-image
          IMAGE_NAME: circleci
          TAG: test
          SOFT_FAIL: true